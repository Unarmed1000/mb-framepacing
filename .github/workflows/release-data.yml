# SPDX-License-Identifier: LicenseRef-PolyForm-Perimeter-1.0.1
# Release the data libraries (C++, C# and Python readers of the tools' data): push a tag data-v<version> that matches sdk/data/VERSION.
#   1. verify   the tag is semantic versioning and matches sdk/data/VERSION, and the version bump covers the API changes since the
#               previous release (tools/check_semver.py)
#   2. test     the C++, C# and Python libraries on Windows, Ubuntu and macOS, against the golden data
#   3. package  the C++ source archives (tar.gz, zip) and SHA256SUMS; the extracted archive must build, pass its tests, install and work
#               through find_package and FetchContent (URL + URL_HASH) before anything is published
#   4. release  a GitHub Release with the archives and the snippets to use them
#   5. conan    the released archive built and tested through the Conan recipe (sdk/conan) on Windows, Ubuntu and macOS
# See doc/releasing.md. Everything uses the default GITHUB_TOKEN; GitHub-hosted runners are free for public repositories.
name: release-data

on:
  push:
    tags: ["data-v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous release is the API baseline
      - id: version
        name: Tag is data-v<semver> and matches sdk/data/VERSION
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#data-v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not data-v<major>.<minor>.<patch>, optionally with -alpha.N, -beta.N or -rc.N"; exit 1
          fi
          expected="$(tr -d '[:space:]' < sdk/data/VERSION)"
          if [ "$version" != "$expected" ]; then
            echo "::error::the tag says $version, sdk/data/VERSION says $expected"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: The version bump covers the API changes since the previous release
        run: |
          dotnet tool restore
          python3 tools/check_semver.py

  test:
    name: test ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: CMake 4
        uses: lukka/get-cmake@v4.4.2
      - name: C++ library
        shell: bash
        run: |
          cmake -S sdk/data/cpp -B sdk/data/cpp/build/release -DCMAKE_BUILD_TYPE=Release
          cmake --build sdk/data/cpp/build/release --config Release --parallel
          ctest --test-dir sdk/data/cpp/build/release -C Release --output-on-failure
      - name: C# library
        run: dotnet test sdk/data/csharp/UnitTest/MB.FramePacing.Data.UnitTest.csproj -c Release
      - name: Python library
        shell: bash
        run: |
          # Windows runners have 'python', Linux and macOS 'python3'
          "$(command -v python3 || command -v python)" -m unittest discover -s sdk/data/python -t sdk/data/python

  package:
    name: package C++ archives
    needs: [verify, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: CMake 4
        uses: lukka/get-cmake@v4.4.2
      - name: Create and verify the archives
        run: python3 sdk/data/cpp/package_release.py --output dist --verify
      - uses: actions/upload-artifact@v7
        with:
          name: data-release
          path: dist/
          retention-days: 7

  release:
    name: GitHub Release
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: data-release
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          sha256="$(grep "mb-framepacingdata-cpp-$VERSION.tar.gz" dist/SHA256SUMS | cut -d' ' -f1)"
          # find_package takes the numbers only: 0.2.0-beta.1 asks for 0.2
          numbers="${VERSION%%-*}"
          major_minor="${numbers%.*}"
          # A pre-release (a version with -alpha.N, -beta.N or -rc.N) is marked as one on GitHub
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          marker="$(tr -d '[:space:]' < sdk/marker/VERSION)"
          marker_numbers="${marker%%-*}"
          cat > notes.md <<EOF
          ## C++ (CMake 4.0+, C++20)

          It needs the marker library (mb_framemarker ${marker_numbers%.*}), which decodes the markers' payloads: make it available first.

          \`\`\`cmake
          include(FetchContent)
          FetchContent_Declare(mb_framemarker
            URL https://github.com/${GITHUB_REPOSITORY}/releases/download/marker-v${marker}/mb-framemarker-cpp-${marker}.tar.gz
            URL_HASH SHA256=<from the marker release's SHA256SUMS>
            FIND_PACKAGE_ARGS ${marker_numbers%.*} CONFIG)
          FetchContent_Declare(mb_framepacingdata
            URL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/mb-framepacingdata-cpp-${VERSION}.tar.gz
            URL_HASH SHA256=${sha256}
            FIND_PACKAGE_ARGS ${major_minor} CONFIG)
          FetchContent_MakeAvailable(mb_framemarker mb_framepacingdata)
          target_link_libraries(my_tool PRIVATE mb::framepacingdata)
          \`\`\`

          ## Python (3.12+)

          \`\`\`text
          pip install "git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}#subdirectory=sdk/data/python"
          \`\`\`

          ## C# (.NET 10)

          The library is \`sdk/data/csharp\` at this tag (it references \`sdk/marker/csharp\`).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Data libraries $VERSION" --notes-file notes.md --generate-notes "${prerelease[@]}"

  conan:
    name: Conan recipe ${{ matrix.os }}
    needs: [verify, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: CMake 4 (the test package builds with it)
        uses: lukka/get-cmake@v4.4.2
      - name: The released archive through the recipe (the version is added here only; commit it with tools/add_conan_version.py)
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python="$(command -v python3 || command -v python)"
          "$python" -m venv .venv
          venv_python=.venv/bin/python
          [ -x "$venv_python" ] || venv_python=.venv/Scripts/python
          "$venv_python" -m pip install --quiet "$(grep '^conan==' requirements-dev.txt)"
          "$venv_python" tools/add_conan_version.py data "$VERSION" --repository "$GITHUB_REPOSITORY"
          "$venv_python" tools/check_conan.py --released --library data --version "$VERSION"
