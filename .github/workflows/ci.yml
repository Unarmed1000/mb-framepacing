# Build and test on every supported platform; on a version tag (v*) also publish the self-contained tools.
# GitHub-hosted runners are free for public repositories. For a private repository the minutes come out of the account's
# monthly free quota (macOS counts 10x, Windows 2x); without a payment method GitHub stops the jobs instead of billing.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: CMake 4
        uses: lukka/get-cmake@latest

      - name: ffmpeg (for the end-to-end import tests)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1

      - name: C++ marker library
        shell: bash
        run: |
          cmake -S cpp -B cpp/build/ci -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build/ci --config Release --parallel
          ctest --test-dir cpp/build/ci -C Release --output-on-failure

      - name: .NET build and tests
        run: dotnet test dotnet/mb-framepacing.slnx -c Release

      - name: Self-contained tools
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python3 dotnet/build_standalone.py

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: mb-framepacing-${{ runner.os }}
          path: dotnet/publish/
          retention-days: 30

  format:
    name: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run format:check
