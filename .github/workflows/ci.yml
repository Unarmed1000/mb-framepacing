# SPDX-License-Identifier: LicenseRef-PolyForm-Perimeter-1.0.1
# Build and test on every supported platform; on a tools version tag (tools-v*) also build the self-contained tools.
# GitHub-hosted runners are free for public repositories. For a private repository the minutes come out of the account's
# monthly free quota (macOS counts 10x, Windows 2x); without a payment method GitHub stops the jobs instead of billing.
name: ci

on:
  push:
    branches: [master]
    tags: ["tools-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: CMake 4
        uses: lukka/get-cmake@v4.4.2

      - name: ffmpeg (for the end-to-end import tests)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1

      - name: C++ library (every module)
        shell: bash
        run: |
          cmake -S sdk/cpp -B sdk/cpp/build/ci -DCMAKE_BUILD_TYPE=Release
          cmake --build sdk/cpp/build/ci --config Release --parallel
          ctest --test-dir sdk/cpp/build/ci -C Release --output-on-failure

      - name: C++ library with the core and marker modules only (no nlohmann/json)
        shell: bash
        run: |
          cmake -S sdk/cpp -B sdk/cpp/build/ci-no-data -DCMAKE_BUILD_TYPE=Release -DMB_FRAMEPACING_BUILD_DATA=OFF -DMB_FRAMEPACING_BUILD_PACER=OFF
          cmake --build sdk/cpp/build/ci-no-data --config Release --parallel
          ctest --test-dir sdk/cpp/build/ci-no-data -C Release --output-on-failure
          if [ -d sdk/cpp/build/ci-no-data/_deps/nlohmann_json-src ]; then echo "::error::nlohmann/json was fetched without the data module"; exit 1; fi

      - name: CMake consumers (FetchContent, add_subdirectory, find_package with components)
        shell: bash
        run: |
          # Windows runners have 'python', Linux and macOS 'python3'
          "$(command -v python3 || command -v python)" sdk/cpp/tests/consumer/check_consumers.py

      # A test that runs 5 minutes is hung: the runner ends it and names it. The step's own limit catches a hang after the tests, and
      # unlike the job's limit it ends the step with its log
      - name: .NET build and tests
        timeout-minutes: 20
        run: dotnet test mb-framepacing.slnx -c Release --blame-hang-timeout 5m

      - name: Self-contained tools
        if: startsWith(github.ref, 'refs/tags/tools-v')
        shell: bash
        run: |
          # The tag must match measure/VERSION
          test "${GITHUB_REF_NAME#tools-v}" = "$(tr -d '[:space:]' < measure/VERSION)" || { echo "::error::tag $GITHUB_REF_NAME does not match measure/VERSION"; exit 1; }
          "$(command -v python3 || command -v python)" measure/build_standalone.py

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/tools-v')
        with:
          name: mb-framepacing-${{ runner.os }}
          path: measure/publish/
          retention-days: 30

  lint:
    name: lint (formatting, Python, workflows, Unity package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run format:check
      - name: One class/struct/enum per file
        run: python3 tools/check_one_type_per_file.py
      - name: License identifier in every source file
        run: python3 tools/check_license_headers.py
      - name: uv (Python from .python-version, the dev tools from uv.lock)
        uses: astral-sh/setup-uv@v10.2.0
      - name: Python dev tools (pyproject.toml, uv.lock)
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Python scripts (ruff, basedpyright)
        run: |
          ruff check .
          ruff format --check .
          basedpyright
      - name: Python library (against the golden marker set and the golden data)
        run: python3 -m unittest discover -s sdk/python -t sdk/python
      - name: Reference shaders (glslang; drawing them needs a GPU, see tools/check_shaders.py --render)
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools
          python3 tools/check_shaders.py
      - name: Workflows (actionlint)
        run: actionlint
      - name: Unity package (assemble and validate; Unity itself is not available in CI)
        run: python3 sdk/unity/build_upm.py --output "$RUNNER_TEMP/upm" --check

  dotnet-lint:
    name: .NET lint (CSharpier, dotnet format, vulnerable packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore mb-framepacing.slnx
      # The same as 'mb-quality -r' (which is not available here): apply the automatic fixes of dotnet format ('style' and
      # 'analyzers' separately, so its whitespace rules do not fight CSharpier), then fail when that changed anything.
      # Diagnostics without an automatic fix are left to the build (warnings are errors).
      - name: dotnet format
        run: |
          dotnet format style mb-framepacing.slnx --no-restore
          dotnet format analyzers mb-framepacing.slnx --no-restore
          git diff --exit-code || { echo "::error::dotnet format changed files; run mb-quality -r --repair . (or dotnet format) and commit"; exit 1; }
      - name: CSharpier
        run: dotnet csharpier check .
      - name: Vulnerable packages (direct and transitive)
        shell: bash
        run: |
          report="$(dotnet list mb-framepacing.slnx package --vulnerable --include-transitive)"
          echo "$report"
          if grep -q "has the following vulnerable packages" <<< "$report"; then
            echo "::error::vulnerable NuGet packages, see the log"; exit 1
          fi

  cpp-analysis:
    name: C++ sanitizers and clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: CMake 4
        uses: lukka/get-cmake@v4.4.2
      - name: uv (Python from .python-version, the dev tools from uv.lock)
        uses: astral-sh/setup-uv@v10.2.0
      - name: Python dev tools (clang-format, clang-tidy)
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Tests with AddressSanitizer and UndefinedBehaviorSanitizer
        working-directory: sdk/cpp
        run: cmake --preset linux-sanitize && cmake --build --preset linux-sanitize --parallel && ctest --preset linux-sanitize
      - name: clang-format and clang-tidy
        run: python3 tools/check_cpp.py --preset linux-sanitize

  conan:
    name: Conan recipe ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: CMake 4 (the test packages build with it)
        uses: lukka/get-cmake@v4.4.2
      - name: uv (Python from .python-version, the dev tools from uv.lock)
        uses: astral-sh/setup-uv@v10.2.0
      - name: The recipe, built from this checkout (sdk/cpp/conan as a local-recipes-index remote)
        shell: bash
        run: |
          uv sync --locked
          uv run tools/check_conan.py

  semver:
    name: semantic versions (VERSION files, the SDK's C# API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags are the baseline
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: python3 tools/check_semver.py
