# Dependabot opens pull requests for outdated dependencies (free for public repositories). One grouped pull request per ecosystem
# and week keeps the noise down; CI checks every update. GoogleTest and nlohmann/json (FetchContent URLs in sdk/cpp/CMakeLists.txt
# and sdk/cpp/data/CMakeLists.txt) and the vendored qrcodegen are not covered and are updated by hand. A new license or license change
# needs a row in licenses/README.md.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Directory.Packages.props (central package versions) and .config/dotnet-tools.json (CSharpier, ApiCompat)
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    # The projects stay on long-term support .NET versions (net10.0, and 10.0.x in the workflows): the SDK's own tools stay on
    # that major version too. Raise this with the next long-term support version
    ignore:
      - dependency-name: "Microsoft.DotNet.ApiCompat.Tool"
        versions: [">= 11"]

  # Prettier
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  # pyproject.toml's dev group and uv.lock: ruff, basedpyright, clang-format, clang-tidy, actionlint, Conan
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev-tools:
        patterns: ["*"]
