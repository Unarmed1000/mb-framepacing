# The repository's Python development tools, managed with uv (https://docs.astral.sh/uv/): `uv sync` creates .venv with them on the
# Python of .python-version (the minimum the libraries support), and uv.lock pins every package they bring along. The scripts
# themselves only need the standard library; the SDK's Python library has its own pyproject.toml (sdk/python).
#   uv sync                                    create or update .venv (CI: uv sync --locked)
#   uv run ruff check . && uv run ruff format --check . && uv run basedpyright
#   uv run tools/check_cpp.py                  C++ formatting and clang-tidy (python tools/check_cpp.py, see CLAUDE.md)
#   uv run tools/check_conan.py                the Conan recipe
#   uv lock --upgrade-package ruff             raise one tool (then update its pin below); Dependabot does this weekly
[project]
name = "mb-framepacing-dev"
version = "0"
description = "The mb-framepacing repository's Python development tools"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# Pinned so every machine formats and lints alike: the linters CI runs (ruff, basedpyright, actionlint, clang-format, clang-tidy) and
# Conan for the recipe in sdk/cpp/conan
dev = [
    "actionlint-py==1.7.12.25",
    "basedpyright==1.40.1",
    "clang-format==23.1.1",
    "clang-tidy==22.1.8",
    "conan==2.33.0",
    "ruff==0.16.9",
]

[tool.uv]
# Not a package: nothing here is built or installed, uv only manages the environment
package = false
required-version = ">=0.12"
