# SPDX-License-Identifier: BSD-3-Clause
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mb-framepacing-data"
# The data libraries' version, sdk/data/VERSION as PEP 440 spells it (0.2.0-beta.1 is 0.2.0b1; a test checks that mb_framepacing_data.__version__ matches it)
version = "0.1.0"
description = "Read the mb-framepacing tools' data: the capture data (captures.mbcd) and the analysis output (summary.json, CSVs)"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["mb_framepacing_data/LICENSE"]
authors = [{ name = "Mana Battery ApS" }]
dependencies = []

[project.optional-dependencies]
# Decoding the markers' payloads in the capture data (CaptureDataRecord.try_decode_main)
markers = ["mb-framemarker"]

[project.urls]
Homepage = "https://github.com/Unarmed1000/mb-framepacing"

[tool.setuptools.packages.find]
include = ["mb_framepacing_data*"]
